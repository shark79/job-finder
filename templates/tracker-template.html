<title>__PAGE_TITLE__</title>
<style>
  :root {
    --paper: #f6f4ef;
    --surface: #ffffff;
    --ink: #201e1a;
    --muted: #6f6858;
    --pine: #2e5c4e;
    --pine-ink: #ffffff;
    --ochre: #a5713a;
    --ash: #8c8474;
    --line: #e3dfd3;
    --line-strong: #cfc9ba;
    --shadow: 0 1px 2px rgba(32,30,26,0.06), 0 8px 24px rgba(32,30,26,0.05);
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Georgia", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", "Menlo", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17181a; --surface: #1e2022; --ink: #ece8df; --muted: #9c9587;
      --pine: #5fa98f; --pine-ink: #10201b; --ochre: #d3a468; --ash: #8b857a;
      --line: #2c2d2c; --line-strong: #3a3b39;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #17181a; --surface: #1e2022; --ink: #ece8df; --muted: #9c9587;
    --pine: #5fa98f; --pine-ink: #10201b; --ochre: #d3a468; --ash: #8b857a;
    --line: #2c2d2c; --line-strong: #3a3b39;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--sans);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 28px 80px; }

  header.masthead {
    display: flex; flex-direction: column; gap: 6px;
    padding-bottom: 24px; border-bottom: 1.5px solid var(--line-strong); margin-bottom: 28px;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted);
  }
  h1 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(26px, 3.4vw, 34px);
    margin: 0; text-wrap: balance; letter-spacing: -0.01em;
  }
  .subtitle { color: var(--muted); font-size: 14.5px; max-width: 68ch; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin: 26px 0 34px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .stat .n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 600; line-height: 1.1; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat.high .n { color: var(--pine); }
  .stat.avg .n { color: var(--ochre); }
  .stat.low .n { color: var(--ash); }

  .tier-section { margin-bottom: 40px; }
  .tier-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .tier-head h2 { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0; }
  .tier-head .count { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .tier-note { font-size: 13px; color: var(--muted); margin: -4px 0 14px; max-width: 68ch; }

  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; min-width: 860px; }
  thead th {
    text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 12px 14px;
    border-bottom: 1px solid var(--line-strong); position: sticky; top: 0; background: var(--surface);
  }
  tbody tr { border-bottom: 1px solid var(--line); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: color-mix(in srgb, var(--pine) 5%, transparent); }
  td { padding: 11px 14px; vertical-align: middle; }

  td.company { font-weight: 600; white-space: nowrap; }
  td.role a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
  td.role a:hover { color: var(--pine); border-color: var(--pine); }
  td.role .loc { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

  td.match { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .match-bar {
    display: inline-block; width: 46px; height: 5px; border-radius: 3px; background: var(--line);
    position: relative; margin-right: 8px; vertical-align: middle; overflow: hidden;
  }
  .match-bar span { position: absolute; inset: 0; border-radius: 3px; }
  .high .match-bar span { background: var(--pine); }
  .avg .match-bar span { background: var(--ochre); }
  .low .match-bar span { background: var(--ash); }

  td.resume { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  td.resume a.code {
    display: inline-block; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line-strong);
    background: color-mix(in srgb, var(--pine) 8%, var(--surface)); color: var(--pine); font-weight: 600;
    text-decoration: none;
  }
  td.resume a.code:hover { border-color: var(--pine); }
  td.resume .anchor-note { color: var(--muted); font-style: italic; }

  .status-chip {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.03em; padding: 4px 10px;
    border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); background: var(--paper);
    cursor: default; white-space: nowrap; transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .status-chip[data-applied="true"] {
    background: color-mix(in srgb, var(--pine) 14%, var(--surface)); border-color: var(--pine); color: var(--pine);
  }
  .status-chip[data-applied="true"]::before { content: "✓ "; }

  footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 12.5px;
    color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer .reset {
    font-family: var(--mono); color: var(--muted); background: none; border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  footer .reset:hover { border-color: var(--pine); color: var(--pine); }

  @media (prefers-reduced-motion: reduce) { .status-chip { transition: none; } }
</style>

<div class="wrap">
  <header class="masthead">
    <div class="eyebrow">__EYEBROW__</div>
    <h1>__HEADLINE__</h1>
    <p class="subtitle">__SUBTITLE__</p>
  </header>

  <div class="stats" id="stats"></div>
  <div id="tiers"></div>

  <footer>
    <span id="progress-label"></span>
    <button class="reset" id="reset-btn">Clear all applied marks</button>
  </footer>
</div>

<script>
// Each entry: {company, role, loc, url, match, resumeLink (path or null -> "Use Anchor Resume"), note (optional)}
const DATA = __JOB_DATA__;

function tierOf(m){ return m >= 70 ? "high" : m >= 40 ? "avg" : "low"; }
const TIER_LABEL = { high: "Best match", avg: "Average match", low: "Low priority" };
const TIER_NOTE = {
  high: "Entry/mid level GenAI or agentic-core roles, or senior roles where the domain overlap clears the 80% bar.",
  avg: "Plain-titled Machine Learning Engineer roles outside the specific GenAI/agentic focus — real skill overlap, different domain.",
  low: "Staff/Principal/Director level, or work distant from the anchor resume's production GenAI experience. Shown for completeness only."
};

const STORE_KEY = "__STORE_KEY__";
function loadApplied(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch(e){ return {}; } }
function saveApplied(obj){ localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }
let applied = loadApplied();

function render(){
  const groups = { high: [], avg: [], low: [] };
  DATA.forEach(d => groups[tierOf(d.match)].push(d));
  ["high","avg","low"].forEach(t => groups[t].sort((a,b) => b.match - a.match));

  const statsEl = document.getElementById("stats");
  statsEl.innerHTML = `
    <div class="stat high"><div class="n">${groups.high.length}</div><div class="l">Best match</div></div>
    <div class="stat avg"><div class="n">${groups.avg.length}</div><div class="l">Average match</div></div>
    <div class="stat low"><div class="n">${groups.low.length}</div><div class="l">Low priority</div></div>
    <div class="stat"><div class="n">${DATA.length}</div><div class="l">Total roles found</div></div>
  `;

  const tiersEl = document.getElementById("tiers");
  tiersEl.innerHTML = "";
  ["high","avg","low"].forEach(t => {
    if (!groups[t].length) return;
    const section = document.createElement("section");
    section.className = "tier-section";
    section.innerHTML = `
      <div class="tier-head">
        <h2>${TIER_LABEL[t]}</h2>
        <span class="count">${groups[t].length} role${groups[t].length===1?"":"s"}</span>
      </div>
      <p class="tier-note">${TIER_NOTE[t]}</p>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th style="width:15%">Company</th>
            <th style="width:34%">Role</th>
            <th style="width:13%">Match</th>
            <th style="width:18%">Resume</th>
            <th style="width:20%">Status</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    `;
    const tbody = section.querySelector("tbody");
    groups[t].forEach(d => {
      const tr = document.createElement("tr");
      tr.className = t;
      const isApplied = !!applied[d.url];
      const resumeCell = d.resumeLink
        ? `<a class="code" href="file://${encodeURI(d.resumeLink)}" target="_blank" rel="noopener">${d.resumeCode || "Resume"}</a>`
        : `<span class="anchor-note">Use Anchor Resume</span>`;
      tr.innerHTML = `
        <td class="company">${d.company}</td>
        <td class="role"><a href="${d.url}" target="_blank" rel="noopener" data-url="${d.url}">${d.role}</a><span class="loc">${d.loc}${d.note ? " · " + d.note : ""}</span></td>
        <td class="match"><span class="match-bar"><span style="width:${d.match}%"></span></span>${d.match}%</td>
        <td class="resume">${resumeCell}</td>
        <td><button class="status-chip" data-applied="${isApplied}" data-url="${d.url}">${isApplied ? "Applied" : "Open"}</button></td>
      `;
      tbody.appendChild(tr);
    });
    tiersEl.appendChild(section);
  });

  updateProgress();
}

function markApplied(url){
  applied[url] = true;
  saveApplied(applied);
  document.querySelectorAll(`[data-url="${CSS.escape(url)}"]`).forEach(el => {
    if (el.tagName === "BUTTON") { el.dataset.applied = "true"; el.textContent = "Applied"; }
  });
  updateProgress();
}

function updateProgress(){
  const total = DATA.length;
  const done = Object.keys(applied).filter(u => DATA.some(d => d.url === u)).length;
  document.getElementById("progress-label").textContent = `${done} of ${total} marked applied`;
}

document.addEventListener("click", (e) => {
  const link = e.target.closest("td.role a");
  if (link) { markApplied(link.dataset.url); return; }
  const chip = e.target.closest(".status-chip");
  if (chip) { e.preventDefault(); if (chip.dataset.applied !== "true") markApplied(chip.dataset.url); }
});

document.getElementById("reset-btn").addEventListener("click", () => {
  if (!confirm("Clear all applied marks?")) return;
  applied = {};
  saveApplied(applied);
  render();
});

render();
</script>
